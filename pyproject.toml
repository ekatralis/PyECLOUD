[build-system]
requires = ["meson-python>=0.18", "meson>=1.3", "ninja", "numpy>=2.0,<3", "Cython>=3.0"]
build-backend = "mesonpy"

[project]
name = "PyECLOUD"
version = "8.7.2"
description = "Electron cloud simulations for particle accelerators"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ['numpy>=2.0,<3', 'scipy>=1.13', 'matplotlib>=3.9', 'h5py>=3.11', 'PyCOMPLETE-PyPIC>=2.4.6,<3']

[project.optional-dependencies]
klu = ["PyCOMPLETE-PyPIC[klu]>=2.4.6,<3"]
tracking = ["PyHEADTAIL>=1.16.5"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/PyCOMPLETE/PyECLOUD"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win*"
test-requires = ["pytest>=8", "PyKLU>=0.2.0"]
test-command = "python {project}/tools/test_installed.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y gcc-gfortran"

[tool.cibuildwheel.macos]
before-all = "brew install gcc"
